# 构建矩阵:
#   linux   — ubuntu:20.04 容器内构建 AppImage(glibc 2.31 发布基线),与本地
#             `packaging/make_appimage.sh` 完全同一脚本(CI 只是少一层 podman);
#   macos   — macos-15-intel(x86_64)构建 .app → dmg(macOS 10.15 基线,Qt 6.2);
#   windows — windows-2022(x64)构建便携 zip(Windows 10 基线,Qt 6.2 + MSVC)。
# push 到 main:构建 + ctest;打 v* tag:三平台构建后由 release job 汇总发布
# (单一入口出唯一总 SHA256SUMS,各构建 job 不再直传——避免同名资产互撞)。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # v* tag 时发布 Release 需要

jobs:
  linux:
    name: Linux AppImage (glibc 2.31 基线)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    env:
      # CI 网络好,用官方源(本地构建默认阿里镜像,见脚本)
      APT_MIRROR: archive.ubuntu.com
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      # ubuntu:20.04 基础镜像无 git/ca-certificates/libatomic1,checkout 前先补上;
      # safe.directory '*' 防容器内 dubious ownership(工作区属主是宿主 uid)。
      - name: 安装 git 与运行库(checkout 依赖)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates libatomic1
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
      - name: 构建 + 测试 + AppImage(与本地同一脚本)
        run: bash packaging/make_appimage.sh --in-container
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 1f6s-desktop-linux-x86_64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS dmg (x86_64, macOS 10.15 基线)
    # macos-13 已于 2025-12 退役;macos-15-intel 是 Intel 路径,预计可用至 2027-08
    # (github.blog/changelog/2025-09-19)。arm64 见文末注释块。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      # 镜像自带 python3 是 externally-managed(PEP 668)/缺 pip,直接装会 exit 1;
      # setup-python 给一个带 pip 的干净解释器。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装工具链(aqtinstall/cmake/ninja;cmake+ninja 仅为对齐本地版本)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall cmake ninja
      - name: 安装 Qt 6.2.4 (qtbase + qttools)
        run: |
          # qttools 提供 macdeployqt(qtbase 不含;Linux 侧用 linuxdeploy 故不需要)
          aqt install-qt mac desktop 6.2.4 clang_64 --archives qtbase qttools --outputdir "$HOME/Qt"
          # Qt 6.2 的 mac 包(参数名 clang_64)实际安装目录是 macos/——
          # 官方二进制为 X86_64-ARM64 通用构建,Intel/Apple Silicon 共用。
          QT_ROOT="$HOME/Qt/6.2.4/macos"
          [ -x "$QT_ROOT/bin/qmake" ] || { echo "qmake 不在 $QT_ROOT"; ls "$HOME/Qt/6.2.4"; exit 1; }
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
      - name: brew 安装 ffmpeg(仅 ctest 造 fixture 与真转码用)
        run: brew install ffmpeg
      - name: CMake 配置 + 构建 (Release)
        run: |
          # 10.15 而非 10.14:std::filesystem 在 macOS 上 availability 门槛是 10.15;
          # 且 2012+ MacBook 均可跑 10.15,硬件覆盖面与 10.14 相同。
          cmake -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build-macos
      - name: ctest
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-macos --output-on-failure
      - name: 组装 .app(macdeployqt + evermeet 静态引擎)
        run: |
          set -euxo pipefail
          VER=$(sed -n 's/^project(1f6s-desktop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          APP=app/1f6s-desktop.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/doc/licenses"
          cp build-macos/1f6s-desktop "$APP/Contents/MacOS/"
          sed "s/@VER@/$VER/g" packaging/Info.plist.in > "$APP/Contents/Info.plist"
          # 图标:PNG → icns(sips/iconutil 是 macOS 自带)
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s packaging/icon/1f6s-desktop-256.png \
              --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/1f6s-desktop.icns"
          # 再分发合规:THIRD_PARTY.md 与许可文本随包
          cp THIRD_PARTY.md "$APP/Contents/Resources/doc/"
          cp packaging/licenses/* "$APP/Contents/Resources/doc/licenses/"
          # assets(spec/i18n/因子表)随包:打包态回退目录是 MacOS 的上级
          # (Contents/assets,见 i18n::assetCandidates)。曾整段漏拷——
          # 组装步骤没有它,真机首开弹 spec_missing,靠打包冒烟拦住。
          cp -r assets "$APP/Contents/assets"
          "$QT_ROOT/bin/macdeployqt" "$APP" -verbose=1
          # 内置静态引擎(engines.json darwin-amd64 主选 evermeet.cx;getrelease 别名指向最新 release)
          TMP=$(mktemp -d)
          curl -sSL --retry 3 -o "$TMP/ffmpeg.zip"  "https://evermeet.cx/ffmpeg/getrelease/zip"
          curl -sSL --retry 3 -o "$TMP/ffprobe.zip" "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          unzip -o -j "$TMP/ffmpeg.zip"  -d "$TMP"
          unzip -o -j "$TMP/ffprobe.zip" -d "$TMP"
          enc=$("$TMP/ffmpeg" -hide_banner -encoders 2>/dev/null)
          echo "$enc" | grep -qE '\blibx264\b'
          echo "$enc" | grep -qE '\blibx265\b'
          echo "$enc" | grep -qE '\baac\b'
          "$TMP/ffmpeg" -version | head -1
          # 静态引擎二进制不被 macdeployqt 处理,直接放进 Contents/MacOS
          # (运行时经 applicationDirPath() 定位,见 src/jobs/engine.cpp)
          cp "$TMP/ffmpeg" "$TMP/ffprobe" "$APP/Contents/MacOS/"
          shasum -a 256 "$APP/Contents/MacOS/ffmpeg" "$APP/Contents/MacOS/ffprobe" \
            > "$APP/Contents/Resources/doc/engines-macos.sha256"
      - name: 打包产物冒烟(offscreen,3 秒自退)
        run: |
          set -euxo pipefail
          APP=app/1f6s-desktop.app
          # qoffscreen 只在冒烟时放入,验完即删(不随包分发)
          cp "$QT_ROOT/plugins/platforms/libqoffscreen.dylib" \
            "$APP/Contents/PlugIns/platforms/"
          bash packaging/smoke_launch.sh "$APP/Contents/MacOS/1f6s-desktop" 90
          rm "$APP/Contents/PlugIns/platforms/libqoffscreen.dylib"
      - name: 打 dmg + SHA256SUMS
        run: |
          set -euxo pipefail
          VER=$(sed -n 's/^project(1f6s-desktop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          mkdir -p dist
          hdiutil create -volname "1f6s-desktop" -srcfolder app/1f6s-desktop.app \
            -format UDZO -ov "dist/1f6s-desktop-${VER}-x86_64.dmg"
          ( cd dist && shasum -a 256 * > SHA256SUMS )
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 1f6s-desktop-macos-x86_64
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows 便携 zip (x64, Windows 10 基线)
    # windows-2022 带 VS2022;Qt 6.2.4 官方二进制是 msvc2019_64(v142),
    # 与 v143 二进制 ABI 兼容(MSVC 2015 起稳定)。步骤用 runner 自带 git-bash
    # ——Windows runner 默认 shell 是 pwsh(\ 续行符与 bash 语法均不认,首跑即翻车)。
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # 同 macos:setup-python 给带 pip 的干净解释器
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装工具链(aqtinstall;cmake/ctest 用镜像自带)
        run: python -m pip install --upgrade pip aqtinstall
      - name: 安装 Qt 6.2.4 (win64_msvc2019_64)
        run: |
          python -m aqt install-qt windows desktop 6.2.4 win64_msvc2019_64 \
            --archives qtbase --outputdir "$HOME/Qt"
          # cygpath -m:C:/ 风格——给原生 cmake/windeployqt 用,git-bash 也认
          QT_ROOT=$(cygpath -m "$HOME/Qt/6.2.4/msvc2019_64")
          [ -f "$QT_ROOT/bin/qmake.exe" ] || { echo "qmake 不在 $QT_ROOT"; ls "$HOME/Qt/6.2.4"; exit 1; }
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
      - name: 下载静态引擎(BtbN n8.1.2 win64-gpl)+ sha256 校验 + 编码器冒烟
        run: |
          set -euxo pipefail
          mkdir -p engines-win
          curl -sSL --retry 3 -C - -o engines-win/ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-n8.1.2-52-g5a03dfa0f6-win64-gpl-8.1.zip"
          echo "f42dca81bdcce7ccab00bde91ceceb96685beab97c42a77c003c90771b47eb17  engines-win/ffmpeg.zip" | sha256sum -c -
          7z x -y -oengines-win engines-win/ffmpeg.zip >/dev/null
          ENGINES_DIR=$(dirname "$(find engines-win -name ffmpeg.exe -print -quit)")
          ls -la "$ENGINES_DIR"
          # 版本与编码器断言:先捕获进变量再 grep(SIGPIPE 教训,同 macos job)
          "$ENGINES_DIR/ffmpeg.exe" -version 2>/dev/null | sed -n 1p
          enc=$("$ENGINES_DIR/ffmpeg.exe" -hide_banner -encoders 2>/dev/null)
          echo "$enc" | grep -qE '\blibx264\b'
          echo "$enc" | grep -qE '\blibx265\b'
          echo "$enc" | grep -qE '\baac\b'
          echo "ENGINES_DIR=$PWD/$ENGINES_DIR" >> "$GITHUB_ENV"
      - name: CMake 配置 + 构建 (Release)
        run: |
          # VS 生成器免 vcvars/三方 action;ctest 四个真转码测试靠 PATH 里的引擎
          cmake -B build-win -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build-win --config Release
      - name: ctest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euxo pipefail
          # Windows 无 rpath:构建树里的测试 exe 找不到 Qt6*.dll(0xc0000135)。
          # bash→原生进程的 PATH 形态转换不可靠(C:/ 形态混进 POSIX 列表),
          # 直接 windeployqt 把 Qt DLL 部署到测试 exe 同目录——8 个 exe 同
          # 目录,部署一次全覆盖;ffmpeg 引擎目录走 POSIX 形态 PATH 注入。
          ls "$QT_ROOT/bin/Qt6Core.dll"
          ls build-win/tests/Release/test_vectors.exe
          "$QT_ROOT/bin/windeployqt.exe" --release --no-translations \
            build-win/tests/Release/test_vectors.exe
          export PATH="$ENGINES_DIR:$PATH"
          ctest --test-dir build-win -C Release --output-on-failure
      - name: 组装便携 zip + 打包产物冒烟
        run: bash packaging/make_windows_zip.sh build-win "$QT_ROOT" "$ENGINES_DIR" dist
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 1f6s-desktop-windows-x64
          path: dist/
          if-no-files-found: error

  # 三平台各自直传 Release 的老流程有硬伤:每 job 都带一份同名 SHA256SUMS
  # 资产互撞,且三个 job 并发创建同一 Release 竞态。改为汇总单点发布。
  release:
    name: 汇总发布 Release(仅 v* tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - name: 汇总三平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 重新生成唯一总 SHA256SUMS
        run: |
          set -euxo pipefail
          cd dist
          # 各 job 自带的同名 SHA256SUMS 在 merge 时只剩最后一份,统一删掉重生成
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ---- 可选:Apple Silicon 原生构建(本次不启用,待真机验证后放开) ----
  # 差异点:
  #   runs-on: macos-14(arm64)
  #   aqt install-qt mac desktop 6.2.4 clang_arm64 --archives qtbase icu
  #   引擎换 osxexperts.net(engines.json darwin-arm64):
  #     curl -o ffmpeg.zip  https://www.osxexperts.net/ffmpeg9arm.zip
  #     curl -o ffprobe.zip https://www.osxexperts.net/ffprobe9arm.zip
  #     按页面公布 SHA256 校验后:xattr -dr com.apple.quarantine <解压文件>
  #     codesign -s - <ffmpeg/ffprobe>(ad-hoc 签名,Apple Silicon 必需)
  #   dmg 命名 1f6s-desktop-<VER>-arm64.dmg;engines.json 已注明该源
  #   "for educational purposes only",商用分发前需法务确认。
